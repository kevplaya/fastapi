version: '3.9'

services:
  mysql:
    image: mysql:8.0.32
    hostname: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3306:3306

  app:
    build: .
    image: wanted-project
    volumes:
      - .:/wanted
    depends_on:
      - mysql
    ports:
      - 8000:8000
    environment:
      - POETRY_VIRTUALENVS_CREATE=false